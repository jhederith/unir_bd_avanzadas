name: Validación de XML

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar XML contra XSD
        uses: phpcsstandards/xmllint-validate@v2.0.0
        with:
          pattern: "xml/resultado.xml"
          xsd-file: "xsd/esquema_personal.xsd" 

      - name: Validación con xmllint
        run: |
          xmllint --schema xsd/esquema_personal.xsd xml/resultado.xml --noout