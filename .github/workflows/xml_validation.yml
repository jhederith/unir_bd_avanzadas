name: Validación de xml
on:
  push:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar XML contra XSD
        uses: phpcsstandards/xmllint-validate@v2.0.0
        with:
          pattern: "xml/*.xml"
          
          xsd-file: "xsd/*.xsd"

      - name: Validación con xmllint
        run: |
          xmllint --schema xsd/*.xsd xml/*.xml --noout
